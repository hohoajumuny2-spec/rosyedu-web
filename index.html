<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로지에듀 최준용 국어 - AI 튜터 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .chat-box { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold text-center text-blue-800 mb-6">로지에듀 최준용 국어</h1>
            <div class="space-y-4">
                <input type="text" id="login-class" placeholder="소속 (예: 고1 미강고, 논술)" class="w-full border p-2 rounded">
                <input type="text" id="login-name" placeholder="이름 (예: 홍길동, 최준용)" class="w-full border p-2 rounded">
                <input type="password" id="login-pw" placeholder="관리자 비밀번호 (원장님만 입력)" class="w-full border p-2 rounded">
                <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">입장하기</button>
            </div>
            <p id="login-msg" class="text-red-500 text-sm mt-2 text-center"></p>
        </div>
    </div>

    <!-- 2. 메인 시스템 화면 -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- 상단 네비게이션 -->
        <header class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">로지에듀 24시 국최 AI</h1>
            <div>
                <span id="user-info" class="mr-4 font-semibold"></span>
                <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm hover:bg-red-600">로그아웃</button>
            </div>
        </header>

        <!-- 탭 메뉴 -->
        <nav class="bg-white shadow-sm flex space-x-1 p-2 justify-center">
            <button onclick="switchTab('chat')" class="px-4 py-2 hover:bg-blue-50 rounded">🧠 AI 질문하기</button>
            <button onclick="switchTab('omr')" class="px-4 py-2 hover:bg-blue-50 rounded">💯 OMR 자동 채점</button>
            <button id="admin-tab-btn" onclick="switchTab('admin')" class="hidden px-4 py-2 font-bold text-blue-600 hover:bg-blue-50 rounded">⚙️ 원장님 관제실</button>
        </nav>

        <!-- 본문 영역 -->
        <main class="flex-grow p-6 flex justify-center">
            <div class="w-full max-w-4xl bg-white shadow-lg rounded-lg p-6">
                
                <!-- AI 질문 탭 -->
                <div id="tab-chat" class="tab-content active">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2">🧠 지식 검색 AI 튜터</h2>
                    <div id="chat-history" class="chat-box space-y-4 mb-4 p-4 bg-gray-50 border rounded h-80">
                        <div class="text-gray-500 text-center text-sm mt-10">궁금한 문제나 개념을 물어보세요! (예: 바탕 7회 독서 4번 정답이 뭐야?)</div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="chat-input" class="flex-grow border p-2 rounded" placeholder="질문을 입력하세요...">
                        <button onclick="sendChat()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">전송</button>
                    </div>
                </div>

                <!-- OMR 자동 채점 탭 -->
                <div id="tab-omr" class="tab-content">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2">💯 OMR 자동 채점</h2>
                    <input type="text" id="omr-task" placeholder="과제명 (예: 미강고 중간고사 대비 1회)" class="w-full border p-2 rounded mb-4">
                    
                    <div class="grid grid-cols-5 gap-2 mb-4" id="omr-inputs">
                        <input type="text" placeholder="1번 답" class="border p-2 rounded text-center omr-ans">
                        <input type="text" placeholder="2번 답" class="border p-2 rounded text-center omr-ans">
                        <input type="text" placeholder="3번 답" class="border p-2 rounded text-center omr-ans">
                        <input type="text" placeholder="4번 답" class="border p-2 rounded text-center omr-ans">
                        <input type="text" placeholder="5번 답" class="border p-2 rounded text-center omr-ans">
                    </div>
                    
                    <button onclick="submitOMR()" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700">답안 제출 및 채점</button>
                    <div id="omr-result" class="mt-6 p-4 rounded bg-gray-50 hidden"></div>
                </div>

                <!-- 원장님 관제실 탭 -->
                <div id="tab-admin" class="tab-content">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2 text-blue-800">⚙️ AI 두뇌 지식 주입 (원장님 전용)</h2>
                    <div class="border-2 border-dashed border-gray-300 rounded p-10 text-center bg-gray-50">
                        <p class="mb-4 text-gray-600">학원 자체 교재, 모의고사 해설지 텍스트 파일(.txt)을 올려주세요.</p>
                        <input type="file" id="knowledge-files" multiple accept=".txt" class="mb-4">
                        <br>
                        <button onclick="uploadKnowledge()" class="bg-blue-800 text-white px-6 py-2 rounded hover:bg-blue-900 font-bold">서버에 자료 이식하기</button>
                    </div>
                    <p id="admin-msg" class="mt-4 font-bold text-center"></p>
                </div>

            </div>
        </main>
    </div>

    <script>
        // ★★★ 원장님 전용 렌더(Render) 클라우드 파이썬 서버 주소 ★★★
        const API_URL = "https://korean-ai-tutor.onrender.com";
        
        let currentUser = null;

        async function login() {
            const sClass = document.getElementById('login-class').value.trim();
            const sName = document.getElementById('login-name').value.trim();
            const sPw = document.getElementById('login-pw').value.trim();

            if (!sClass || !sName) {
                document.getElementById('login-msg').textContent = "소속과 이름을 입력해주세요.";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_class: sClass, student_name: sName, admin_password: sPw })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    currentUser = { class: sClass, name: sName, isAdmin: data.is_admin };
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    document.getElementById('user-info').textContent = `${sClass} ${sName}님 접속중`;
                    
                    if (data.is_admin) {
                        document.getElementById('admin-tab-btn').classList.remove('hidden');
                        alert(data.message);
                    }
                } else {
                    document.getElementById('login-msg').textContent = data.detail || "로그인 실패";
                }
            } catch (error) {
                document.getElementById('login-msg').textContent = "서버 연결에 실패했습니다. 서버가 켜져 있는지 확인해주세요.";
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-pw').value = '';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML += `<div class="text-right"><span class="bg-blue-100 p-2 rounded inline-block">${prompt}</span></div>`;
            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const res = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_class: currentUser.class, student_name: currentUser.name, prompt: prompt })
                });
                const data = await res.json();
                
                if (data.success) {
                    chatHistory.innerHTML += `<div class="text-left"><span class="bg-gray-200 p-2 rounded inline-block whitespace-pre-wrap">${data.reply}</span></div>`;
                }
            } catch (error) {
                chatHistory.innerHTML += `<div class="text-left"><span class="bg-red-100 p-2 rounded inline-block text-red-600">서버 연결 오류가 발생했습니다.</span></div>`;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function submitOMR() {
            const taskName = document.getElementById('omr-task').value.trim();
            const inputs = document.querySelectorAll('.omr-ans');
            const answers = Array.from(inputs).map(inp => inp.value);

            if (!taskName) return alert('과제명을 입력해주세요.');

            try {
                const res = await fetch(`${API_URL}/api/omr/submit`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_class: currentUser.class,
                        student_name: currentUser.name,
                        task_name: taskName,
                        answers: answers
                    })
                });
                
                const data = await res.json();
                const resultDiv = document.getElementById('omr-result');
                resultDiv.classList.remove('hidden');

                if (res.ok && data.success) {
                    let html = `<h3 class="text-lg font-bold">채점 결과: ${data.score}점</h3>`;
                    if (data.score === 100) {
                        html += `<p class="text-green-600 font-bold mb-2">🎉 완벽합니다! 만점입니다!</p>`;
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    } else {
                        html += `<p class="text-red-500 mb-2">틀린 문항: ${data.wrongs.join(', ')}</p>`;
                    }
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p class="text-red-500">${data.detail || '채점 실패'}</p>`;
                }
            } catch (error) {
                alert("서버 오류가 발생했습니다.");
            }
        }

        async function uploadKnowledge() {
            const fileInput = document.getElementById('knowledge-files');
            if (fileInput.files.length === 0) return alert('파일을 선택해주세요.');

            const formData = new FormData();
            for (const file of fileInput.files) {
                formData.append('files', file);
            }

            try {
                const res = await fetch(`${API_URL}/api/admin/knowledge/bulk`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    document.getElementById('admin-msg').className = "mt-4 font-bold text-center text-green-600";
                    document.getElementById('admin-msg').textContent = data.message;
                    fileInput.value = '';
                } else {
                    throw new Error(data.detail);
                }
            } catch (error) {
                document.getElementById('admin-msg').className = "mt-4 font-bold text-center text-red-600";
                document.getElementById('admin-msg').textContent = "업로드 실패: " + error.message;
            }
        }
    </script>
</body>
</html>
