<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로지에듀 국어학원 스마트 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none !important; }
        .tab-btn.active { border-bottom: 2px solid #10b981; color: #10b981; }
        .glass-panel { background: rgba(21, 25, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="flex-grow flex items-center justify-center">
        <div class="glass-panel p-8 rounded-xl w-96 shadow-2xl">
            <h2 class="text-2xl font-bold text-center text-white mb-6">로지에듀 학습 시스템</h2>
            <input type="text" id="login-school" placeholder="학교 (예: 하남고)" class="w-full p-3 bg-gray-800 rounded mb-3 text-white">
            <input type="text" id="login-grade" placeholder="학년 (예: 1학년)" class="w-full p-3 bg-gray-800 rounded mb-3 text-white">
            <input type="text" id="login-name" placeholder="학생 이름 (관리자는 비번 입력)" class="w-full p-3 bg-gray-800 rounded mb-4 text-white">
            <input type="password" id="login-pw" placeholder="관리자 비밀번호 (학생은 비워둠)" class="w-full p-3 bg-gray-800 rounded mb-6 text-white">
            <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded text-white font-bold transition">접속하기</button>
        </div>
    </div>

    <!-- 2. 관리자(원장님) 화면 -->
    <div id="admin-screen" class="hidden h-full flex flex-col">
        <header class="bg-[#151922] p-4 flex justify-between items-center border-b border-gray-700">
            <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>원장님 관제실</h1>
            <div class="flex gap-4">
                <button onclick="showAdminTab('admin-knowledge')" class="tab-btn active text-gray-400 hover:text-white font-bold pb-2">AI 자료학습</button>
                <button onclick="showAdminTab('admin-generator')" class="tab-btn text-gray-400 hover:text-white font-bold pb-2">문제 출제기</button>
                <button onclick="showAdminTab('admin-students')" class="tab-btn text-gray-400 hover:text-white font-bold pb-2">학생/성적 관리</button>
                <button onclick="logout()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </header>

        <main class="flex-grow p-6 overflow-y-auto">
            <!-- 자료학습 탭 -->
            <div id="admin-knowledge" class="admin-tab-content grid grid-cols-2 gap-4">
                <div class="bg-[#151922] p-6 rounded">
                    <h4 class="text-white font-bold mb-2">단일 자료 직접 등록</h4>
                    <input type="text" id="kb-title" placeholder="자료 제목 (비워두면 파일명 자동등록)" class="w-full p-2 bg-gray-800 text-white mb-2">
                    <textarea id="kb-content" class="w-full h-24 bg-gray-800 text-white mb-2" placeholder="직접 내용을 입력하거나, 아래에서 파일을 선택하면 AI가 요약합니다."></textarea>
                    <input type="file" id="kb-files" multiple class="text-white mb-2">
                    <button onclick="uploadKnowledge()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 text-white mt-2 transition font-bold shadow-lg">저장 및 학습</button>
                    
                    <h4 class="text-emerald-400 font-bold mb-2 mt-6 pt-4 border-t border-gray-700">⚡ 파일 대량 일괄 등록 (PDF, 이미지)</h4>
                    <p class="text-xs text-gray-400 mb-2">여러 개의 파일을 한 번에 선택하세요. 파일명이 제목으로 자동 지정되며, AI가 스스로 읽고 각각 저장합니다.</p>
                    <input type="file" id="kb-bulk-files" multiple accept=".pdf, image/*" class="w-full text-white mb-2">
                    <button onclick="uploadKnowledgeBulk()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 text-white font-bold rounded mt-2 transition shadow-lg">여러 파일 한 번에 싹 다 넣기</button>
                </div>
                <div class="bg-[#151922] p-6 rounded h-[600px] flex flex-col">
                    <h3 class="text-lg font-bold text-emerald-400 mb-4 border-b border-gray-700 pb-2"><i class="fa-solid fa-list mr-2"></i>학습된 자료 목록</h3>
                    <div id="admin-kb-view-list" class="flex-grow overflow-y-auto text-white space-y-2"></div>
                </div>
            </div>[cite: 3]

            <!-- 출제 탭 -->
            <div id="admin-generator" class="admin-tab-content hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-[#151922] p-6 rounded flex flex-col h-[800px] border border-gray-700 relative">
                    <h3 class="text-xl font-bold mb-4 text-white"><i class="fa-solid fa-wand-magic-sparkles text-yellow-400 mr-2"></i>정밀 문제 출제 엔진</h3>
                    <input type="text" id="gen-title" placeholder="출제할 문제집의 제목을 입력하세요" class="w-full bg-[#1e2430] border border-blue-500 p-3 rounded-lg text-white mb-4 outline-none focus:ring-2 focus:ring-blue-500 transition shadow-lg">[cite: 3]
                    <textarea id="gen-text" placeholder="지문이나 참고할 텍스트를 입력하세요." class="w-full h-32 bg-gray-800 text-white mb-4 p-2 rounded"></textarea>
                    <button onclick="analyzeTextStream()" class="w-full bg-purple-600 hover:bg-purple-700 py-3 text-white font-bold rounded mt-2 transition">출제 시작 (스트리밍)</button>
                    <div id="gen-result" class="mt-4 p-4 bg-gray-900 rounded flex-grow overflow-y-auto text-sm text-gray-300"></div>
                </div>
                <!-- 우측 모의고사 배포 등 UI 생략 (기존과 동일하게 구성 가능) -->
            </div>
            
            <!-- 학생/성적 관리 탭 -->
            <div id="admin-students" class="admin-tab-content hidden">
                <div class="bg-[#151922] p-6 rounded border border-gray-700">
                    <h3 class="text-xl font-bold mb-4 text-white">학생 성적/과제 리포트 (A~E 난이도 분석)</h3>
                    <div id="report-list" class="space-y-2"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. 학생 화면 -->
    <div id="student-screen" class="hidden h-full flex flex-col">
        <header class="bg-[#151922] p-4 flex justify-between items-center border-b border-gray-700">
            <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-graduation-cap mr-2"></i>스마트 학습실</h1>
            <div class="flex gap-4">
                <button onclick="showStudentTab('student-chat')" class="tab-btn active text-gray-400 hover:text-white font-bold pb-2">AI 튜터 '국최'</button>
                <button onclick="logout()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
            </div>
        </header>

        <main class="flex-grow p-6 overflow-y-auto flex justify-center">
            <!-- AI 채팅 탭 (RAG 연동) -->
            <div id="student-chat" class="student-tab-content w-full max-w-3xl flex flex-col h-[700px] bg-[#151922] rounded-xl border border-gray-700 p-4">
                <div id="chat-box" class="flex-grow overflow-y-auto mb-4 space-y-4 pr-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="원장님 자료를 바탕으로 질문에 답해줍니다." class="flex-grow bg-gray-800 text-white p-3 rounded outline-none focus:ring-1 focus:ring-blue-500" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded text-white font-bold"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        const API_URL = "http://localhost:8000"; // 배포 시 실제 렌더 서버 도메인으로 변경하세요.
        let currentUser = null;

        // --- 공통 UI 제어 ---
        function switchScreen(screenId) {
            ['login-screen', 'admin-screen', 'student-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showAdminTab(tabId) {
            document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('#admin-screen .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if(tabId === 'admin-knowledge') loadKnowledgeList();
            if(tabId === 'admin-students') loadReports();
        }

        // --- 로그인/로그아웃 ---
        async function login() {
            const school = document.getElementById('login-school').value;
            const grade = document.getElementById('login-grade').value;
            const name = document.getElementById('login-name').value;
            const pw = document.getElementById('login-pw').value;

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ school, grade, student_name: name, admin_password: pw })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = { school, grade, name };
                    if (data.is_admin) {
                        switchScreen('admin-screen');
                        loadKnowledgeList();
                    } else {
                        switchScreen('student-screen');
                    }
                } else {
                    alert(data.detail);
                }
            } catch (e) {
                alert("서버 연결 실패");
            }
        }

        function logout() {
            currentUser = null;
            switchScreen('login-screen');
        }

        // --- 원장님 기능: 지식 베이스 (단일/대량 등록) ---
        async function uploadKnowledge() { 
            const t = document.getElementById('kb-title').value; 
            const c = document.getElementById('kb-content').value; 
            const files = document.getElementById('kb-files').files;
            
            if(!t && files.length === 0) return alert("제목이나 파일을 입력해주세요!"); 
            
            const fd = new FormData(); 
            fd.append("title", t || (files.length > 0 ? files[0].name.split('.')[0] : "제목 없음")); 
            fd.append("content", c); 
            for(let i=0; i<files.length; i++) fd.append("files", files[i]);
            
            try { 
                await fetch(`${API_URL}/api/admin/knowledge`, {method: 'POST', body: fd}); 
                alert("개별 학습 완료"); 
                loadKnowledgeList(); 
                document.getElementById('kb-title').value=''; 
                document.getElementById('kb-content').value=''; 
                document.getElementById('kb-files').value=''; 
            } catch(e) { alert("업로드 실패"); } 
        }[cite: 4]

        async function uploadKnowledgeBulk() {              
            const files = document.getElementById('kb-bulk-files').files;              
            if(files.length === 0) return alert("대량으로 등록할 파일들을 선택해주세요!");              
            
            alert(`⚡ ${files.length}개의 파일을 AI가 분석하고 있습니다...\n(파일이 많을수록 시간이 걸립니다. 창을 닫지 마세요!)`);              
            const fd = new FormData();              
            for(let i=0; i<files.length; i++) { fd.append("files", files[i]); }              
            
            try {                  
                const res = await fetch(`${API_URL}/api/admin/knowledge/bulk`, {method: 'POST', body: fd});                  
                const data = await res.json();                 
                if(data.success) {                     
                    alert(`${data.count}개의 파일이 성공적으로 개별 학습되었습니다!`);                     
                    document.getElementById('kb-bulk-files').value = '';                     
                    loadKnowledgeList();                  
                } else {                     
                    alert("오류가 발생했습니다.");                 
                }             
            } catch(e) {                 
                alert("서버 연결에 실패했습니다.");             
            }          
        }[cite: 4]

        async function loadKnowledgeList() { 
            try{ 
                const res=await fetch(`${API_URL}/api/knowledge`); 
                const data=await res.json(); 
                const c=document.getElementById('admin-kb-view-list'); 
                c.innerHTML=''; 
                if(data.success) { 
                    data.knowledge.forEach(k => { 
                        c.innerHTML += `
                        <div class="bg-gray-800 p-3 rounded mb-2 text-white flex justify-between items-center border border-gray-700">
                            <span class="font-bold truncate w-2/3"><i class="fa-solid fa-database mr-2 text-emerald-400"></i>${k.title}</span>
                            <button onclick="deleteKnowledge('${k.id}')" class="text-red-400 text-xs bg-red-900/30 hover:bg-red-900/50 px-3 py-1 rounded transition">삭제</button>
                        </div>`; 
                    }); 
                } 
            } catch(e) {} 
        }[cite: 4]

        async function deleteKnowledge(id) { 
            if(confirm("이 자료를 AI 두뇌에서 영구 삭제하시겠습니까?")) { 
                await fetch(`${API_URL}/api/admin/knowledge/${id}`, {method:'DELETE'}); 
                loadKnowledgeList(); 
            } 
        }[cite: 4]

        // --- 원장님 기능: 스트리밍 문제 출제 ---
        async function analyzeTextStream() {             
            const btn = document.querySelector('button[onclick="analyzeTextStream()"]');             
            if(btn) { btn.disabled = true; btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin mr-2'></i>분석 및 출제 중..."; }

            const fd = new FormData();              
            fd.append("q_mode", "출제");              
            fd.append("q_types", "내신 변형 문제");              
            fd.append("cnt_killer", 1); fd.append("cnt_semi", 2); fd.append("cnt_high", 2); fd.append("cnt_mid", 0); fd.append("cnt_low", 0);              
            fd.append("q_text", document.getElementById('gen-text').value);              

            try {
                const res = await fetch(`${API_URL}/api/admin/generate_stream`, { method: 'POST', body: fd });
                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                const resultBox = document.getElementById('gen-result');
                resultBox.innerHTML = '';
                
                while(true) {
                    const {done, value} = await reader.read();
                    if(done) break;
                    resultBox.innerHTML += decoder.decode(value).replace(/\n/g, '<br>');
                    resultBox.scrollTop = resultBox.scrollHeight;
                }
            } catch (e) {
                alert("출제 중 오류 발생");
            } finally {
                if(btn) { btn.disabled = false; btn.innerHTML = "출제 시작 (스트리밍)"; }
            }
        }[cite: 4]

        // --- 리포트 조회 (A~E 난이도 연동) ---
        async function loadReports() {
            try {
                const res = await fetch(`${API_URL}/api/admin/reports`);
                const data = await res.json();
                const c = document.getElementById('report-list');
                c.innerHTML = '';
                if(data.success) {
                    data.reports.forEach(r => {
                        let potentialHtml = "";
                        if(r.potential_ab) {
                            potentialHtml = `<div class="text-xs text-emerald-400 mt-1">A~B 맞췄을 때: ${r.potential_ab}점 / 실수(C) 잡으면: ${r.potential_abc}점</div>`;
                        }
                        c.innerHTML += `
                        <div class="bg-gray-800 p-4 rounded mb-2 border border-gray-700">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="font-bold text-white">${r.student_name} (${r.school} ${r.grade})</span>
                                    <span class="ml-2 text-xs bg-blue-900/50 text-blue-300 px-2 py-1 rounded">${r.type}</span>
                                </div>
                                <span class="text-xs text-gray-400">${r.submitted_at}</span>
                            </div>
                            <div class="text-sm text-gray-300">
                                <strong>${r.task_name}</strong> - 획득 점수: <span class="font-bold text-yellow-400">${r.score}점</span>
                                ${r.wrongs && r.wrongs.length > 0 ? `<div class="mt-1 text-red-400 text-xs">오답 번호: ${r.wrongs.join(', ')}</div>` : ''}
                                ${potentialHtml}
                            </div>
                        </div>`;
                    });
                }
            } catch(e) {}
        }

        // --- 학생 기능: AI 채팅 ---
        async function sendChat() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            if(!input.value.trim()) return;

            // 내 메시지 표시
            box.innerHTML += `<div class="text-right mb-2"><span class="bg-blue-600 text-white px-4 py-2 rounded-lg inline-block max-w-[80%]">${input.value}</span></div>`;
            const prompt = input.value;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            // 로딩 표시
            const loadingId = 'loading-' + Date.now();
            box.innerHTML += `<div id="${loadingId}" class="text-left mb-2"><span class="bg-gray-800 text-gray-400 px-4 py-2 rounded-lg inline-block"><i class="fa-solid fa-spinner fa-spin"></i> 국최가 원장님 자료를 검색 중입니다...</span></div>`;
            box.scrollTop = box.scrollHeight;

            const fd = new FormData();
            fd.append("school", currentUser.school);
            fd.append("grade", currentUser.grade);
            fd.append("student_name", currentUser.name);
            fd.append("prompt", prompt);

            try {
                const res = await fetch(`${API_URL}/api/chat`, { method: 'POST', body: fd });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                if(data.success) {
                    const formattedReply = data.reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-400">$1</strong>');
                    box.innerHTML += `<div class="text-left mb-2"><span class="bg-gray-800 text-white px-4 py-2 rounded-lg inline-block max-w-[90%] border border-gray-700">${formattedReply}</span></div>`;
                } else {
                    box.innerHTML += `<div class="text-left mb-2"><span class="bg-red-900/50 text-red-400 px-4 py-2 rounded-lg inline-block">통신 오류가 발생했습니다.</span></div>`;
                }
            } catch(e) {
                document.getElementById(loadingId).remove();
                box.innerHTML += `<div class="text-left mb-2"><span class="bg-red-900/50 text-red-400 px-4 py-2 rounded-lg inline-block">서버에 연결할 수 없습니다.</span></div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
